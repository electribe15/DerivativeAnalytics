# CI — runs the test suite on every push and pull request.
# Copy to .github/workflows/ci.yml in the repo.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pandas numpy scipy requests plotly reportlab pytest

      - name: Compile check
        run: |
          python -m py_compile dex_gex_dashboard.py
          python -m py_compile streamlit_app.py

      - name: Run tests
        run: pytest test_dashboard.py -v --tb=short
